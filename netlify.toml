# Netlify site config for this pnpm monorepo.
# Keep Base directory empty in the Netlify UI (repository root) so pnpm
# installs from the workspace lockfile. Do not set Base to packages/nextjs.
#
# The Next.js app is a client-side dApp, so production builds emit a static
# site to packages/nextjs/out (see next.config.ts + NETLIFY=true).

[build]
  command = "pnpm sdk:build && pnpm next:build"
  publish = "packages/nextjs/out"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--version"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[dev]
  command = "pnpm start"
  targetPort = 3000
  framework = "#custom"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
